version: '3.8'

services:
  # 1. Nginx: ประตูหน้าบ้าน รวบทุกอย่างเข้าพอร์ต 80
  nginx:
    image: nginx:alpine
    container_name: main_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - main_shared_network
    depends_on:
      - nextjs_web
      - ai_server

  # 2. Next.js: ตัวเว็บหลัก (Frontend + API Routes)
  nextjs_web:
    build: ./frontend
    container_name: nextjs_app
    restart: always
    environment:
      # เชื่อมต่อไปยัง MySQL (ข้ามโปรเจกต์)
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@mysql_server:3306/${DB_NAME}
      # เชื่อมต่อไปยัง AI Server (ในโปรเจกต์เดียวกัน)
      - AI_SERVER_URL=http://lightgbm_api:8000
    networks:
      - main_shared_network

  # 3. AI Server: สำหรับรัน Model LightGBM
  ai_server:
    build: ./pythonAIAPI  # ชี้ไปยังโฟลเดอร์ที่เก็บโค้ด AI
    container_name: lightgbm_api
    restart: always
    volumes:
      - ./pythonAIAPI:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - main_shared_network

networks:
  main_shared_network:
    external: true  # จอยวงแลนกลางที่สร้างไว้