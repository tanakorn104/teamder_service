version: '3.8'

services:
  # 1. Nginx: ประตูหน้าบ้าน รวบทุกอย่างเข้าพอร์ต 80
  nginx:
    image: nginx:alpine
    container_name: main_proxy
    ports:
      - "8800:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - main_shared_network
    depends_on:
      - ai_server

  # frontend:
  #   build: ./frontend
  #   container_name: nextjs_app
  #   restart: always
  #   networks:
  #     - main_shared_network
  #   # ดึงค่าจากไฟล์ .env ที่ Root ของ Server
  #   env_file:
  #     - .env


  # 3. AI Server: สำหรับรัน Model LightGBM
  lightgbm_api:
    build: ./pythonAIAPI  # ชี้ไปยังโฟลเดอร์ที่เก็บโค้ด AI
    container_name: lightgbm_api
    restart: always
    volumes:
      - ./pythonAIAPI:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - main_shared_network

networks:
  main_shared_network:
    external: true  # จอยวงแลนกลางที่สร้างไว้