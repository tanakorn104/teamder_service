server {
    listen 8080;
 port_in_redirect off;
        absolute_redirect off;
    # ทางไป Next.js (หน้าหลัก)
    #     location / {
    #     # ใช้ตัวแปรเก็บชื่อไว้ Nginx จะไม่พยายามหาชื่อนี้จนกว่าจะมีคนเรียกเข้าหน้าเว็บจริงๆ
    #     set $frontend_upstream http://nextjs_app:3000;
    #     proxy_pass $frontend_upstream;

    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
        
    #     # กรณีรันบน Windows แล้วยังไม่รันบน Server คนเข้าจะเจอ 502 (Bad Gateway)
    #     # ซึ่งถูกต้องแล้ว เพราะเรายังไม่ได้เอางานหน้าบ้านมาลง Server
    # }

    # ทางไป Python API (เรียกผ่าน /api)
    location /model/ {
        proxy_pass http://lightgbm_api:8000/; # ใส่ / ปิดท้ายเพื่อตัดคำว่า /api ออกตอนส่งให้ Python
        proxy_set_header Host $host;
    }

    #ทางไป phpMyAdmin (มุดไปหาโปรเจกต์ Database ที่แยกไว้)
   location /pma/ {
        proxy_pass http://mysql_ui/; # สังเกต '/' ปิดท้าย เพื่อตัดคำว่า /pma ออกก่อนส่งให้ phpmyadmin
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # บรรทัดสำคัญ: เพื่อให้ phpMyAdmin รู้ว่ามันรันอยู่ภายใต้ /pma
        proxy_set_header X-Script-Name /pma;
    }
}