server {
    listen 80;

    # ทางไป Next.js (หน้าหลัก)
    location / {
        proxy_pass http://nextjs_app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ทางไป Python API (เรียกผ่าน /api)
    location /api/ {
        proxy_pass http://lightgbm_api:8000/; # ใส่ / ปิดท้ายเพื่อตัดคำว่า /api ออกตอนส่งให้ Python
        proxy_set_header Host $host;
    }

    # ทางไป phpMyAdmin (มุดไปหาโปรเจกต์ Database ที่แยกไว้)
    location /pma/ {
        proxy_pass http://mysql_ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Script-Name /pma;
    }
}